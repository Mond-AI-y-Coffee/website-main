baseURL       = "https://mondaiycoffee.com/"
languageCode  = "en-us"
title         = "Mond(AI)y Coffee"
timeZone      = "America/New_York"   # so "Next Meeting" rolls on Atlanta time, DST included
buildFuture   = true   # allows upcoming speaker posts to appear before their date
disableKinds  = ["taxonomy", "term"]

[params]
  description = "A free weekly coffee meetup for AI builders and curious minds in Atlanta. Every Monday at 8:30am at ATDC in Midtown. No RSVP required."
  image       = "images/about-alex-lugo-presentation.jpg"
  # Standing logistics, so the homepage meeting card and the schema block agree.
  meeting_time  = "8:30 – 10:00 am"
  venue_name    = "ATDC"
  venue_address = "75 5th St NW, Suite 2230, Atlanta"
  venue_map     = "https://maps.google.com/?q=75+5th+St+NW+Suite+2230+Atlanta+GA+30308"

[markup.goldmark.renderer]
  unsafe = true
