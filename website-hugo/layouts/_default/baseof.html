<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">

    {{ partial "nav.html" . }}

    {{ block "hero" . }}{{ partial "hero.html" . }}{{ end }}

    <hr class="rule" />

    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

  </div>

  <script src="/js/nav.js"></script>

  {{ block "scripts" . }}{{ end }}

  {{ partial "schema.html" . }}

  {{ block "schema" . }}{{ end }}
</body>
</html>
